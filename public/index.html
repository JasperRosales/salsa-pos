<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3261e">
<title>S.A.L.S.A. POS</title>
<style>
  :root {
    --ink: #1f1a17;
    --muted: #6d625b;
    --line: #e7ddd5;
    --paper: #fffaf5;
    --card: #ffffff;
    --chili: #b3261e;
    --chili-dark: #8c1d17;
    --lime: #2f7d32;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--paper);
    padding-bottom: calc(120px + env(safe-area-inset-bottom));
  }
  header {
    background: var(--chili);
    color: #fff;
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .02em; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .85; }
  main { max-width: 640px; margin: 0 auto; padding: 12px; }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }
  h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  select, input {
    width: 100%;
    font: inherit;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    min-height: 44px;
  }
  .pay { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pay button {
    font: inherit; font-size: 14px; min-height: 44px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
  }
  .pay button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .product {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-top: 1px solid var(--line);
  }
  .product:first-of-type { border-top: 0; }
  .product .info { flex: 1; min-width: 0; }
  .product .name { font-weight: 600; }
  .product .price { font-size: 13px; color: var(--muted); }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--line); background: #fff; font-size: 22px; line-height: 1; color: var(--ink);
  }
  .stepper button.plus { background: var(--chili); border-color: var(--chili); color: #fff; }
  .stepper output { width: 32px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .product.has-qty .name { color: var(--chili-dark); }
  .totals div { display: flex; justify-content: space-between; padding: 3px 0; font-variant-numeric: tabular-nums; }
  .totals .grand { font-size: 20px; font-weight: 700; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(255, 250, 245, .96);
    border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .bar .inner { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; }
  .bar button { font: inherit; font-weight: 700; min-height: 52px; border-radius: 12px; border: 0; }
  #clear { background: #fff; border: 1px solid var(--line); color: var(--ink); padding: 0 16px; }
  #submit { flex: 1; background: var(--chili); color: #fff; font-size: 17px; }
  #submit:disabled { background: #d8c9c0; color: #fff; }
  .msg { border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; display: none; }
  .msg.ok { display: block; background: #e8f4e8; color: var(--lime); border: 1px solid #c4e1c5; }
  .msg.err { display: block; background: #fbeaea; color: var(--chili-dark); border: 1px solid #f0c7c4; }
  .sale { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .sale:first-child { border-top: 0; }
  .sale .top { display: flex; justify-content: space-between; font-weight: 600; }
  .sale .meta { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); font-size: 14px; }
  @media (max-width: 380px) { .pay { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>S.A.L.S.A. POS</h1>
  <p>New sales go into the ETL pipeline's CSV.</p>
</header>

<main>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>

  <section>
    <h2>Shift</h2>
    <div class="grid2">
      <div><label for="store">Store</label><select id="store"></select></div>
      <div><label for="cashier">Cashier</label><select id="cashier"></select></div>
    </div>
  </section>

  <section>
    <h2>Items</h2>
    <div id="products"><p class="empty">Loading…</p></div>
  </section>

  <section>
    <h2>Payment</h2>
    <div class="pay" id="pay"></div>
    <div style="margin-top:10px">
      <label for="discount">Discount (₱)</label>
      <input id="discount" inputmode="decimal" placeholder="0.00" autocomplete="off">
    </div>
    <div class="totals" style="margin-top:12px">
      <div><span>Subtotal</span><span id="subtotal">₱0.00</span></div>
      <div><span>Discount</span><span id="disc">−₱0.00</span></div>
      <div class="grand"><span>Total</span><span id="total">₱0.00</span></div>
    </div>
  </section>

  <section>
    <h2>Recent sales</h2>
    <div id="recent"><p class="empty">Loading…</p></div>
  </section>
</main>

<div class="bar"><div class="inner">
  <button id="clear" type="button">Clear</button>
  <button id="submit" type="button" disabled>Add sale</button>
</div></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { products: [], qty: {}, payment: null, busy: false };
const peso = (minor) => "₱" + (minor / 100).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const toMinor = (text) => Math.round(Number(text) * 100);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function showMsg(kind, text) {
  const el = $("msg");
  el.className = "msg " + kind;
  el.textContent = text;
  if (kind === "ok") setTimeout(() => { if (el.textContent === text) el.className = "msg"; }, 4000);
}

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || "request failed (" + res.status + ")");
  return data;
}

function discountMinor() {
  const raw = $("discount").value.trim();
  if (raw === "") return 0;
  return /^\d{1,7}(\.\d{1,2})?$/.test(raw) ? toMinor(raw) : NaN;
}

function render() {
  let subtotal = 0, lines = 0;
  for (const p of state.products) {
    const q = state.qty[p.sku] || 0;
    subtotal += q * toMinor(p.unit_price);
    if (q) lines++;
    const row = document.querySelector('[data-sku="' + p.sku + '"]');
    row.querySelector("output").textContent = q;
    row.classList.toggle("has-qty", q > 0);
    row.querySelector(".minus").disabled = q === 0;
  }
  const d = discountMinor();
  const discOk = Number.isFinite(d) && d <= subtotal;
  $("subtotal").textContent = peso(subtotal);
  $("disc").textContent = "−" + peso(Number.isFinite(d) ? d : 0);
  $("total").textContent = peso(discOk ? subtotal - d : subtotal);
  $("discount").setCustomValidity(discOk ? "" : "Discount must be a peso amount no larger than the subtotal");
  $("discount").style.borderColor = discOk ? "" : "var(--chili)";
  const ready = lines > 0 && state.payment && discOk && !state.busy;
  $("submit").disabled = !ready;
  $("submit").textContent = state.busy ? "Saving…" : lines ? "Add sale · " + peso(discOk ? subtotal - d : subtotal) : "Add sale";
}

function renderRecent(sales) {
  if (!sales.length) { $("recent").innerHTML = '<p class="empty">No sales yet.</p>'; return; }
  $("recent").innerHTML = sales.map((s) => {
    const when = new Date(s.timestamp);
    const items = (s.items || []).map((i) => i.qty + "× " + esc(i.name)).join(", ");
    return '<div class="sale"><div class="top"><span>' + esc(s.id) + "</span><span>" + peso(toMinor(s.amount)) +
      '</span></div><div class="meta">' + esc(when.toLocaleString()) + " · " + esc(s.store_id) + " · " + esc(s.cashier_id) +
      " · " + esc(s.payment_method) + '</div><div class="meta">' + items + "</div></div>";
  }).join("");
}

async function loadRecent() {
  try {
    renderRecent((await api("/api/sales?limit=10")).sales);
  } catch (err) {
    $("recent").innerHTML = '<p class="empty">' + esc(err.message) + "</p>";
  }
}

function remember(key, el) {
  const saved = localStorage.getItem(key);
  if (saved && [...el.options].some((o) => o.value === saved)) el.value = saved;
  el.addEventListener("change", () => localStorage.setItem(key, el.value));
}

async function init() {
  const cat = await api("/api/catalog");
  state.products = cat.products;
  $("store").innerHTML = cat.stores.map((s) => '<option value="' + esc(s.id) + '">' + esc(s.name) + "</option>").join("");
  $("cashier").innerHTML = cat.cashiers.map((c) => '<option>' + esc(c) + "</option>").join("");
  remember("salsa-pos.store", $("store"));
  remember("salsa-pos.cashier", $("cashier"));

  $("pay").innerHTML = cat.payment_methods.map((m) => '<button type="button" data-pay="' + esc(m) + '" aria-pressed="false">' +
    esc(m === "gcash" ? "GCash" : m === "maya" ? "Maya" : m[0].toUpperCase() + m.slice(1)) + "</button>").join("");
  $("pay").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-pay]");
    if (!b) return;
    state.payment = b.dataset.pay;
    for (const x of $("pay").children) x.setAttribute("aria-pressed", String(x === b));
    render();
  });

  $("products").innerHTML = cat.products.map((p) =>
    '<div class="product" data-sku="' + esc(p.sku) + '"><div class="info"><div class="name">' + esc(p.name) +
    '</div><div class="price">' + peso(toMinor(p.unit_price)) + " · " + esc(p.sku) + '</div></div>' +
    '<div class="stepper"><button type="button" class="minus" aria-label="Remove one ' + esc(p.name) + '">−</button>' +
    '<output>0</output><button type="button" class="plus" aria-label="Add one ' + esc(p.name) + '">+</button></div></div>').join("");
  $("products").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const sku = b.closest(".product").dataset.sku;
    const q = (state.qty[sku] || 0) + (b.classList.contains("plus") ? 1 : -1);
    state.qty[sku] = Math.max(0, Math.min(999, q));
    render();
  });

  $("discount").addEventListener("input", render);
  $("clear").addEventListener("click", clear);
  $("submit").addEventListener("click", submit);
  render();
  loadRecent();
}

function clear() {
  state.qty = {};
  state.payment = null;
  for (const x of $("pay").children) x.setAttribute("aria-pressed", "false");
  $("discount").value = "";
  render();
}

async function submit() {
  if ($("submit").disabled) return;
  state.busy = true;
  render();
  const items = Object.entries(state.qty).filter(([, q]) => q > 0).map(([sku, qty]) => ({ sku, qty }));
  try {
    const { sale } = await api("/api/sales", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        store_id: $("store").value,
        cashier_id: $("cashier").value,
        payment_method: state.payment,
        discount: $("discount").value.trim(),
        items,
      }),
    });
    showMsg("ok", "Saved " + sale.id + " · " + peso(toMinor(sale.amount)) + ". The ETL loads it on its next run.");
    clear();
    loadRecent();
  } catch (err) {
    showMsg("err", "Not saved: " + err.message);
  } finally {
    state.busy = false;
    render();
  }
}

init().catch((err) => showMsg("err", "Could not load the POS: " + err.message));
</script>
</body>
</html>
